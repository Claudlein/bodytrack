<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BodyTrack">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>BodyTrack</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">BODYTRACK</div>
      <h1 id="pageTitle">Übersicht</h1>
    </div>
    <button class="icon-btn" id="quickAdd" aria-label="Neue Messung">＋</button>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button data-tab="dashboard" class="tab active"><span>⌂</span><small>Übersicht</small></button>
    <button data-tab="history" class="tab"><span>☷</span><small>Historie</small></button>
    <button data-tab="charts" class="tab"><span>⌁</span><small>Verlauf</small></button>
    <button data-tab="settings" class="tab"><span>⚙</span><small>Einstellungen</small></button>
  </nav>
</div>

<div class="modal hidden" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="modalTitle">Neue Messung</h2>
      <button class="close" id="closeModal">×</button>
    </div>
    <form id="measurementForm">
      <label>Datum<input type="date" id="date" required></label>

      <section>
        <h3>Gewicht</h3>
        <label>Gewicht <span>kg</span><input inputmode="decimal" id="weight" placeholder="z. B. 82,4"></label>
      </section>

      <section>
        <h3>Körpermaße</h3>
        <div class="grid">
          <label>Taille <span>cm</span><input inputmode="decimal" id="waist"></label>
          <label>Bauch <span>cm</span><input inputmode="decimal" id="abdomen"></label>
          <label>Hüfte <span>cm</span><input inputmode="decimal" id="hips"></label>
          <label>Brust <span>cm</span><input inputmode="decimal" id="chest"></label>
          <label>Oberarm links <span>cm</span><input inputmode="decimal" id="upperArmLeft"></label>
          <label>Oberarm rechts <span>cm</span><input inputmode="decimal" id="upperArmRight"></label>
          <label>Oberschenkel links <span>cm</span><input inputmode="decimal" id="thighLeft"></label>
          <label>Oberschenkel rechts <span>cm</span><input inputmode="decimal" id="thighRight"></label>
        </div>
      </section>

      <label>Notiz<textarea id="note" rows="3" placeholder="Optional"></textarea></label>
      <button class="primary full" type="submit">Messung speichern</button>
      <button class="danger full hidden" type="button" id="deleteFromEdit">Messung löschen</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
